name: Docker-Image-Pusher

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
  ALIYUN_NAME_SPACE: ${{ secrets.ALIYUN_NAME_SPACE }}
  ALIYUN_REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
  ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

jobs:
  build:
    name: sync-image
    runs-on: ubuntu-latest

    steps:
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Checkout
        uses: actions/checkout@v7

      - name: Sync Images To Aliyun
        shell: bash
        run: |
          set -e

          echo "$ALIYUN_REGISTRY_PASSWORD" |
            docker login \
              -u "$ALIYUN_REGISTRY_USER" \
              --password-stdin \
              "$ALIYUN_REGISTRY"

          while IFS= read -r image || [ -n "$image" ]; do
            image="${image%$'\r'}"

            # 跳过空行和注释
            [ -z "$image" ] && continue
            [[ "$image" == \#* ]] && continue

            name="${image##*/}"
            target="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$name"

            echo "Processing: $image"

            # 读取源镜像的原始 manifest
            manifest=$(docker buildx imagetools inspect --raw "$image")

            if jq -e '.manifests' >/dev/null <<< "$manifest"; then
              # 提取真实运行平台，排除 unknown/unknown 和 attestation
              mapfile -t platforms < <(
                jq -r '
                  .manifests[]
                  | select(.platform.os != null)
                  | select(.platform.architecture != null)
                  | select(.platform.os != "unknown")
                  | select(.platform.architecture != "unknown")
                  | select(
                      (.annotations["vnd.docker.reference.type"] // "")
                      != "attestation-manifest"
                    )
                  | .platform.os + "/" + .platform.architecture
                    + if (.platform.variant // "") != ""
                      then "/" + .platform.variant
                      else ""
                      end
                ' <<< "$manifest" | sort -u
              )

              if [ "${#platforms[@]}" -eq 0 ]; then
                echo "ERROR: No runnable platform found: $image"
                exit 1
              fi

              # 转换为多个 --platform linux/amd64
              platform_args=()
              for platform in "${platforms[@]}"; do
                echo "  Keep platform: $platform"
                platform_args+=(--platform "$platform")
              done

              docker buildx imagetools create \
                "${platform_args[@]}" \
                --tag "$target" \
                "$image"
            else
              # 普通单平台镜像没有 manifests 数组，直接同步
              echo "  Single-platform image"

              docker buildx imagetools create \
                --prefer-index=false \
                --tag "$target" \
                "$image"
            fi

            echo "Synced: $target"
          done < images.txt
