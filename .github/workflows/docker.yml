name: Docker-Image-Pusher

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
  ALIYUN_NAME_SPACE: ${{ secrets.ALIYUN_NAME_SPACE }}
  ALIYUN_REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
  ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

jobs:
  build:
    name: sync-image
    runs-on: ubuntu-latest

    steps:
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Checkout
        uses: actions/checkout@v7

      - name: Sync Images To Aliyun
        shell: bash
        run: |
          set -e

          echo "$ALIYUN_REGISTRY_PASSWORD" |
            docker login \
              -u "$ALIYUN_REGISTRY_USER" \
              --password-stdin \
              "$ALIYUN_REGISTRY"

          while IFS= read -r image || [ -n "$image" ]; do
            image="${image%$'\r'}"

            # 跳过空行和注释
            [ -z "$image" ] && continue
            [[ "$image" == \#* ]] && continue

            name="${image##*/}"
            target="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$name"

            echo "Processing: $image"

            # 读取源镜像的原始 manifest
            manifest=$(docker buildx imagetools inspect --raw "$image")

            if jq -e '.manifests' >/dev/null <<< "$manifest"; then
              # 去掉源镜像的 tag/digest，只保留仓库名
              source_repo="${image%@*}"
              last_part="${source_repo##*/}"
              [[ "$last_part" == *:* ]] && source_repo="${source_repo%:*}"
            
              # 只选择可运行平台
              mapfile -t digests < <(
                jq -r '
                  .manifests[]
                  | select(.platform.os != null)
                  | select(.platform.architecture != null)
                  | select(.platform.os != "unknown")
                  | select(.platform.architecture != "unknown")
                  | select(
                      (.annotations["vnd.docker.reference.type"] // "")
                      != "attestation-manifest"
                    )
                  | .digest
                ' <<< "$manifest"
              )
            
              if [ "${#digests[@]}" -eq 0 ]; then
                echo "ERROR: No runnable platform found: $image"
                exit 1
              fi
            
              sources=()
            
              for digest in "${digests[@]}"; do
                platform=$(
                  jq -r --arg digest "$digest" '
                    .manifests[]
                    | select(.digest == $digest)
                    | .platform.os + "/" + .platform.architecture
                      + if (.platform.variant // "") != ""
                        then "/" + .platform.variant
                        else ""
                        end
                  ' <<< "$manifest"
                )
            
                echo "  Keep platform: $platform"
                sources+=("$source_repo@$digest")
              done
            
              # 由真实平台 manifest 重新构造多架构索引
              docker buildx imagetools create \
                --tag "$target" \
                "${sources[@]}"
            else
              # 普通单平台镜像
              docker buildx imagetools create \
                --prefer-index=false \
                --tag "$target" \
                "$image"
            fi

            echo "Synced: $target"
          done < images.txt
